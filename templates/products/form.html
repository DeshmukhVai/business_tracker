{% extends "base.html" %}
{% block title %}{{ 'Edit' if product else 'Add' }} Product{% endblock %}
{% block content %}

<div class="page-header">
  <h1>{{ 'Edit Product' if product else 'Add Product' }}</h1>
</div>

<div class="panel">
  <form method="post">
    <div class="form-grid">
      <div class="form-group">
        <label>Product Name *</label>
        <input type="text" name="name" value="{{ product.name if product else '' }}" required>
      </div>
      <div class="form-group">
        <label>Category</label>
        <input type="text" name="category" value="{{ product.category if product else '' }}" placeholder="e.g. Flowers, Bakery, Craft">
      </div>
      <div class="form-group">
        <label>Selling Price (₹) *</label>
        <input type="number" step="0.01" min="0" name="selling_price" value="{{ product.selling_price if product else '' }}" required>
      </div>
      <div class="form-group">
        <label>Cost Price (₹) *</label>
        <input type="number" step="0.01" min="0" name="cost_price" value="{{ product.cost_price if product else '' }}" required>
      </div>
      <div class="form-group full-width">
        <label>Description</label>
        <textarea name="description">{{ product.description if product else '' }}</textarea>
      </div>
      {% if product %}
      <div class="form-group">
        <label>Status</label>
        <label style="display:flex; align-items:center; gap:8px; font-weight:400;">
          <input type="checkbox" name="is_active" {{ 'checked' if product.is_active }}> Active
        </label>
      </div>
      {% endif %}
    </div>
    <div class="form-actions">
      <button class="btn" type="submit">Save</button>
      <a href="{{ url_for('products.list_products') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
