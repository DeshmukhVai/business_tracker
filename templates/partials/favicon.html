{# Tab icon. Included by both layouts so the signed-out pages carry it too.
   SVG first for crisp rendering on high-DPI screens; the PNG is the fallback
   for browsers that do not take SVG favicons. #}
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon.png') }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
