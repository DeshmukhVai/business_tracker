{% extends "base.html" %}
{% block title %}{{ 'Edit' if customer else 'Add' }} Customer{% endblock %}
{% block content %}

<div class="page-header">
  <h1>{{ 'Edit Customer' if customer else 'Add Customer' }}</h1>
</div>

<div class="panel">
  <form method="post">
    <div class="form-grid">
      <div class="form-group">
        <label>Customer Name *</label>
        <input type="text" name="name" value="{{ customer.name if customer else '' }}" required>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="text" name="phone" value="{{ customer.phone if customer else '' }}">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" value="{{ customer.email if customer else '' }}">
      </div>
      <div class="form-group full-width">
        <label>Address</label>
        <input type="text" name="address" value="{{ customer.address if customer else '' }}">
      </div>
      <div class="form-group full-width">
        <label>Notes</label>
        <textarea name="notes">{{ customer.notes if customer else '' }}</textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn" type="submit">Save</button>
      <a href="{{ url_for('customers.list_customers') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
